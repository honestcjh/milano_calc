<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>IL CONTO · 밀라노 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#FFF8F2;--card:#FFFFFF;--ink:#2C1A0E;--soft:#8A6E62;
  --line:#EEE5DD;--terra:#E8694A;--sun:#F2B134;
  --credit:#2E8A5C;--debit:#D94F30;
  --sh:0 2px 14px rgba(44,26,14,.07);--sh-sm:0 1px 6px rgba(44,26,14,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;}
#app{max-width:560px;margin:0 auto;min-height:100vh;}
.num{font-family:ui-monospace,"SF Mono",monospace;font-variant-numeric:tabular-nums;}
.cr{color:var(--credit);} .db{color:var(--debit);} .muted{color:var(--soft);}
button,input,select{font-family:'Nunito',sans-serif;}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;
  box-shadow:0 1px 0 var(--line),0 2px 10px rgba(44,26,14,.05);}
.hdr-in{max-width:560px;margin:0 auto;padding:12px 18px 0;}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;}
.brand{font-size:1.55rem;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--terra),var(--sun));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:.6rem;font-weight:800;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;margin-left:7px;}
.sync-btn{background:none;border:1.5px solid var(--line);border-radius:999px;
  padding:6px 14px;font-size:.74rem;color:var(--soft);font-weight:800;}
.tabs{display:flex;}
.tab{flex:1;background:none;border:none;padding:10px 2px;font-size:.76rem;font-weight:800;
  color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.on{color:var(--terra);border-bottom-color:var(--terra);}
.content{padding:122px 16px 48px;}

/* ── CARD ── */
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);}
.sec-h{font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:10px;}

/* ── CTA ── */
.cta{width:100%;background:linear-gradient(135deg,var(--terra),#F08050);color:#fff;border:none;
  border-radius:18px;padding:20px;text-align:center;font-size:1.05rem;font-weight:900;
  margin-bottom:16px;box-shadow:0 6px 18px rgba(232,105,74,.28);}

/* ── CURRENCY TABS ── */
.cur-tabs{display:flex;gap:6px;margin-bottom:14px;}
.cur-tab{flex:1;padding:9px;border:1.5px solid var(--line);background:#fff;border-radius:11px;
  font-size:.8rem;font-weight:800;color:var(--soft);}
.cur-tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ── BALANCE ── */
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.bal-cell{background:var(--cream);border-radius:13px;padding:12px;}
.bal-cell .lbl{font-size:.66rem;color:var(--soft);font-weight:800;margin-bottom:3px;}
.bal-cell .val{font-size:1.1rem;font-weight:900;}
.bal-list{display:flex;flex-direction:column;gap:0;}
.bal-row{display:flex;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.bal-row:last-child{border-bottom:none;}
.bal-bar{height:5px;border-radius:999px;margin-top:4px;}

/* ── TRANSFER ── */
.txn-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:.9rem;}
.txn-row:last-child{border-bottom:none;}
.txn-arrow{color:var(--soft);margin:0 8px;font-size:.8rem;}
.dots{flex:1;border-bottom:1.5px dotted var(--line);margin:0 8px;transform:translateY(-3px);}

/* ── FORM ── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;}
.field>span{font-size:.72rem;color:var(--soft);font-weight:800;}
.field input,.field select{font-size:.95rem;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:11px;background:#fff;color:var(--ink);font-weight:700;width:100%;}
.field input:focus,.field select:focus{outline:2px solid var(--terra);border-color:transparent;}
.seg{display:flex;gap:5px;margin-bottom:13px;}
.seg button{flex:1;padding:10px 6px;border:1.5px solid var(--line);background:#fff;
  border-radius:11px;font-size:.8rem;font-weight:800;color:var(--soft);}
.seg button.on{background:var(--terra);color:#fff;border-color:var(--terra);}
.day-seg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
.day-seg button{padding:8px 2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  font-size:.7rem;font-weight:800;color:var(--soft);text-align:center;line-height:1.3;}
.day-seg button .dow{font-size:.58rem;opacity:.65;display:block;}
.day-seg button.on{background:var(--terra);color:#fff;border-color:var(--terra);}
.time-seg{display:flex;gap:5px;margin-bottom:13px;}
.time-seg button{flex:1;padding:9px 4px;border:1.5px solid var(--line);background:#fff;
  border-radius:10px;font-size:.76rem;font-weight:800;color:var(--soft);}
.time-seg button.on{background:var(--sun);color:var(--ink);border-color:var(--sun);}
.prow{display:flex;align-items:center;gap:9px;padding:5px 0;}
.chk{display:flex;align-items:center;gap:9px;flex:1;cursor:pointer;user-select:none;}
.box{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;position:relative;flex:none;}
.box.on{background:var(--terra);border-color:var(--terra);}
.box.on::after{content:"✓";color:#fff;font-size:13px;font-weight:900;position:absolute;left:3px;top:-1px;}
.pname{font-size:.92rem;font-weight:700;}
.payer-tag{font-size:.6rem;background:var(--sun);color:var(--ink);padding:1px 7px;
  border-radius:999px;font-weight:900;margin-left:4px;}
.amt-inp{width:108px;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--line);
  border-radius:9px;text-align:right;font-weight:700;}
.hint{font-size:.72rem;color:var(--soft);font-weight:600;}
.save{width:100%;background:linear-gradient(135deg,var(--terra),#F08050);color:#fff;border:none;
  border-radius:13px;padding:16px;font-size:1rem;font-weight:900;
  box-shadow:0 4px 12px rgba(232,105,74,.28);margin-top:12px;}
.err{background:#FFE9E4;color:var(--debit);border-radius:10px;padding:10px 13px;
  font-size:.82rem;margin-bottom:10px;font-weight:700;}

/* ── RECEIPT ── */
.receipt{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
  box-shadow:var(--sh-sm);cursor:pointer;transition:background .15s;}
.receipt:hover{background:#FFFAF6;}
.receipt.open{background:#FFFAF6;}
.r-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.r-title{font-weight:800;font-size:1rem;}
.r-meta{font-size:.7rem;color:var(--soft);margin-top:3px;font-weight:600;}
.r-amt{font-weight:900;font-size:1.05rem;color:var(--terra);white-space:nowrap;}
.r-body{display:none;margin-top:13px;padding-top:13px;border-top:1px solid var(--line);}
.receipt.open .r-body{display:block;}
.share-line{display:flex;align-items:center;font-size:.88rem;padding:5px 0;}
.del-btn{width:100%;margin-top:14px;background:#FFE9E4;border:none;border-radius:10px;
  padding:11px;font-size:.82rem;font-weight:800;color:var(--debit);}

/* ── MISC ── */
.empty{text-align:center;color:var(--soft);padding:48px 18px;line-height:1.8;font-weight:600;}
.foot{text-align:center;font-size:.66rem;color:var(--soft);padding:18px;font-weight:600;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;
  font-size:.82rem;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}

/* ── LOGIN ── */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;background:linear-gradient(160deg,#FFF2E6,#FFF8F2 50%,#F2F6FF);}
.l-flag{font-size:3rem;margin-bottom:8px;}
.l-brand{font-size:2.6rem;font-weight:900;letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--terra),var(--sun));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.l-sub{font-size:.9rem;color:var(--soft);font-weight:700;text-align:center;margin-bottom:26px;line-height:1.6;}
.l-card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:360px;box-shadow:var(--sh);}
.l-card-h{font-size:1rem;font-weight:900;margin-bottom:14px;}
.l-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.l-btn{padding:14px 6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;
  font-size:.88rem;font-weight:800;color:var(--ink);text-align:center;}
.l-btn:active{background:var(--cream);}
.l-btn.claimed::after{content:" ✓";color:var(--credit);font-size:.7rem;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-el" class="toast"></div>
<script>
/* ─── CONFIG ─── */
const BIN_ID     = "6a38dd76f5f4af5e291b671d";
const MASTER_KEY = "$2a$10$lnj2XARlHWVJZ4Vkc3YtNuH.64V8zJei.7NfckLaIR8Py6ZCdkZCa";
const API        = "https://api.jsonbin.io/v3/b/" + BIN_ID;

const PRESET = ["김가영","김민준","김주희","김진현","심성태","양보윤",
                "이승재","이원태","정직한","정현주","조현지","최필성"];
const ADMIN = "정직한";

const CUR = {
  EUR:{sym:"€",factor:100,dp:2,name:"유로"},
  KRW:{sym:"₩",factor:1,dp:0,name:"원화"},
  TRY:{sym:"₺",factor:100,dp:2,name:"리라"},
};
const DAYS=[
  {date:"2026-06-21",label:"21일",dow:"일"},{date:"2026-06-22",label:"22일",dow:"월"},
  {date:"2026-06-23",label:"23일",dow:"화"},{date:"2026-06-24",label:"24일",dow:"수"},
  {date:"2026-06-25",label:"25일",dow:"목"},{date:"2026-06-26",label:"26일",dow:"금"},
  {date:"2026-06-27",label:"27일",dow:"토"},
];
const TIMES = ["오전","점심","오후","저녁","밤"];
const CTA = ["이번엔 제 카드로 하시죠 →","잠깐, 제가 긁겠습니다 →",
             "오늘은 제가 한 번 쏠게요 →","제가 결제 한 번 해보겠습니다 →"];

/* ─── STATE ─── */
let state = {splits:[], me:null};  // me = 로그인한 사람 이름
let tab = "home";
let form = null;
let cur = "EUR";


/* ─── UTILS ─── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMinor = (v,c) => Math.round((parseFloat(String(v).replace(",","."))||0)*CUR[c].factor);
const fmt = (minor,c) => CUR[c].sym+(minor/CUR[c].factor).toLocaleString("ko-KR",{minimumFractionDigits:CUR[c].dp,maximumFractionDigits:CUR[c].dp});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function toast(msg, dur=2500) {
  const t = $("#toast-el");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), dur);
}

/* ─── 밀라노 현지 시간 (KST -7h) ─── */
function milanoNow() {
  const d = new Date(Date.now() - 7*3600*1000);
  const date = d.toISOString().slice(0,10);
  const h = d.getUTCHours();
  let timeSlot = h<11?"오전":h<14?"점심":h<17?"오후":h<22?"저녁":"밤";
  return {date, timeSlot};
}

/* ─── CACHE ─── */
const CACHE = "ilconto_v3";
function loadCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE)||"{}");
    if(c.splits) state.splits = c.splits;
    if(c.me)     state.me     = c.me;
  } catch(e){}
}
function saveCache() {
  try { localStorage.setItem(CACHE, JSON.stringify({splits:state.splits, me:state.me})); } catch(e){}
}

/* ─── API ─── */
async function pull() {
  try {
    const r = await fetch(API+"/latest",{headers:{"X-Master-Key":MASTER_KEY},cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    const d = j.record?.splits ? j.record : (j.record||{});
    state.splits = Array.isArray(d.splits) ? d.splits : [];
    saveCache(); render();
  } catch(e) { console.warn("pull error",e); render(); }
}

async function push(splits) {
  const doput = async () => {
    const r = await fetch(API,{method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY},
      body:JSON.stringify({splits})});
    if(!r.ok) throw new Error(r.status);
  };
  try { await doput(); }
  catch(e) { await new Promise(res=>setTimeout(res,1500)); await doput(); }
}

/* ─── 정산 계산 ─── */
function getBalances(currency) {
  const net = {};
  PRESET.forEach(p => net[p] = 0);
  state.splits.filter(s=>s.currency===currency).forEach(s=>{
    s.shares.forEach(sh=>{
      if(sh.name === s.payer) return;
      net[s.payer] += sh.amount;
      net[sh.name] -= sh.amount;
    });
  });
  return net;
}

function getTransfers(net) {
  const pos = [], neg = [];
  Object.entries(net).forEach(([name,v])=>{
    if(v > 1)  pos.push({name, amt:v});
    if(v < -1) neg.push({name, amt:-v});
  });
  pos.sort((a,b)=>b.amt-a.amt); neg.sort((a,b)=>b.amt-a.amt);
  const txns = []; let i=0, j=0;
  while(i<neg.length && j<pos.length){
    const pay = Math.min(neg[i].amt, pos[j].amt);
    if(pay>1) txns.push({from:neg[i].name, to:pos[j].name, amt:pay});
    neg[i].amt -= pay; pos[j].amt -= pay;
    if(neg[i].amt<=1) i++;
    if(pos[j].amt<=1) j++;
  }
  return txns;
}

function splitEqual(total,n) {
  if(!n) return [];
  const base = Math.floor(total/n); let rem = total - base*n;
  return Array.from({length:n},()=>{const e=rem>0?1:0;if(rem>0)rem--;return base+e;});
}

/* ─── RENDER ─── */
function render() {
  if(!state.me) return renderLogin();
  const ctaTxt = CTA[Math.floor(Date.now()/60000)%CTA.length];
  const isAdmin = state.me === ADMIN;
  $("#app").innerHTML = `
  <div class="hdr"><div class="hdr-in">
    <div class="hdr-row">
      <div><span class="brand">IL CONTO</span><span class="brand-sub">밀라노 정산</span></div>
      <div style="display:flex;gap:6px;align-items:center">
        <span style="font-size:.72rem;color:var(--soft);font-weight:700">${esc(state.me)}</span>
        <button class="sync-btn" id="outBtn">나가기</button>
        <button class="sync-btn" id="syncBtn">↻</button>
      </div>
    </div>
    <div class="tabs">
      ${["home","create","history"].map((t,i)=>
        `<button class="tab ${tab===t?"on":""}" data-t="${t}">${["🏠 홈","💳 내가낼게","🧾 영수증"][i]}</button>`
      ).join("")}
    </div>
  </div></div>
  <div class="content">${tab==="home"?homeHTML(ctaTxt,isAdmin):tab==="create"?createHTML():historyHTML(isAdmin)}</div>
  <div class="foot">🇮🇹 PMBA 14기 밀라노 연수 · 같은 링크 공유 장부</div>`;
  bindMain();
}

/* ── 홈 ── */
function homeHTML(ctaTxt, isAdmin) {
  const net = getBalances(cur);
  const txns = getTransfers(net);
  const hasData = state.splits.some(s=>s.currency===cur);

  // 내 현황
  const myNet = net[state.me]||0;
  const myOut = txns.filter(t=>t.from===state.me);
  const myIn  = txns.filter(t=>t.to===state.me);

  let html = `
  <button class="cta" id="ctaBtn">${esc(ctaTxt)}</button>
  <div class="cur-tabs">
    ${Object.entries(CUR).map(([k,v])=>`<button class="cur-tab ${cur===k?"on":""}" data-c="${k}">${v.sym} ${v.name}</button>`).join("")}
  </div>`;

  if(!hasData) {
    html += `<div class="empty">아직 ${CUR[cur].name} 정산 내역이 없어요 🍕<br>위 버튼으로 첫 정산을 기록해보세요!</div>`;
    return html;
  }

  // 내 지갑
  html += `<div class="card">
    <div class="sec-h">내 정산 현황 (${CUR[cur].name})</div>
    <div class="bal-grid">
      <div class="bal-cell"><div class="lbl">내가 받을 돈</div>
        <div class="val num cr">${fmt(Math.max(0,myNet),cur)}</div></div>
      <div class="bal-cell"><div class="lbl">내가 줄 돈</div>
        <div class="val num db">${fmt(Math.max(0,-myNet),cur)}</div></div>
    </div>`;

  if(myOut.length||myIn.length) {
    html += `<div class="sec-h" style="margin-top:8px;padding-top:12px;border-top:1px dashed var(--line)">송금 정리</div>`;
    myOut.forEach(t=>html+=`<div class="txn-row">
      <span><b>${esc(t.to)}</b>에게 보내기</span><span class="dots"></span>
      <span class="num db">${fmt(t.amt,cur)}</span></div>`);
    myIn.forEach(t=>html+=`<div class="txn-row">
      <span><b>${esc(t.from)}</b>에게서 받기</span><span class="dots"></span>
      <span class="num cr">${fmt(t.amt,cur)}</span></div>`);
  } else {
    html += `<div style="font-size:.84rem;color:var(--soft);margin-top:4px">주고받을 돈이 없어요 😎</div>`;
  }
  html += `</div>`;

  // 전체 정산 가이드
  if(txns.length) {
    html += `<div class="card">
      <div class="sec-h">전체 정산 가이드 (${CUR[cur].name})</div>`;
    txns.forEach(t=>html+=`<div class="txn-row">
      <span class="${t.from===state.me?"db":""}">${esc(t.from)}</span>
      <span class="txn-arrow">→</span>
      <span class="${t.to===state.me?"cr":""}"><b>${esc(t.to)}</b></span>
      <span class="dots"></span>
      <span class="num">${fmt(t.amt,cur)}</span></div>`);
    html += `</div>`;
  }

  // 관리자 전용: 전체 잔액
  if(isAdmin) {
    const active = PRESET.filter(p=>(net[p]||0)!==0);
    if(active.length) {
      html += `<div class="card"><div class="sec-h">👑 전체 잔액 (관리자)</div>`;
      active.forEach(p=>{
        const v=net[p]||0;
        html+=`<div class="bal-row">
          <span style="flex:1;font-weight:700">${esc(p)}</span>
          <span class="dots"></span>
          <span class="num ${v>0?"cr":"db"}">${v>0?"+":""}${fmt(v,cur)}</span></div>`;
      });
      html += `</div>`;
    }
  }
  return html;
}

/* ── 새 정산 ── */
function initForm() {
  if(form) return;
  const {date,timeSlot} = milanoNow();
  const matchDay = DAYS.find(d=>d.date===date)||DAYS[0];
  const checked = {};
  PRESET.forEach(p=>checked[p] = p===state.me); // 본인만 기본 체크
  form = {payer:state.me, day:matchDay.date, timeSlot, cur:"EUR",
          desc:"", total:"", method:"equal", checked, amounts:{}, err:""};
}

function createHTML() {
  initForm();
  const ids = PRESET.filter(p=>form.checked[p]);
  const total = toMinor(form.total, form.cur);
  return `<div class="card">
    <div class="field"><span>결제한 사람</span>
      <select id="fPayer">
        ${PRESET.map(p=>`<option value="${esc(p)}" ${form.payer===p?"selected":""}>${esc(p)}</option>`).join("")}
      </select>
    </div>
    <div class="field"><span>날짜</span>
      <div class="day-seg">${DAYS.map(d=>
        `<button class="dayBtn ${form.day===d.date?"on":""}" data-d="${d.date}">
          <span class="dow">${d.dow}</span>${d.label}</button>`).join("")}
      </div>
    </div>
    <div class="field"><span>시간대</span>
      <div class="time-seg">${TIMES.map(t=>
        `<button class="timeBtn ${form.timeSlot===t?"on":""}" data-t="${t}">${t}</button>`).join("")}
      </div>
    </div>
    <div class="field"><span>내용</span>
      <input id="fDesc" placeholder="예: 두오모 근처 피자 🍕" value="${esc(form.desc)}">
    </div>
    <div class="field"><span>통화</span>
      <div class="seg">${Object.entries(CUR).map(([k,v])=>
        `<button class="curBtn ${form.cur===k?"on":""}" data-c="${k}">${v.sym} ${v.name}</button>`).join("")}
      </div>
    </div>
    <div class="field"><span>분할 방식</span>
      <div class="seg">
        <button class="mBtn ${form.method==="equal"?"on":""}" data-m="equal">똑같이 N빵</button>
        <button class="mBtn ${form.method==="custom"?"on":""}" data-m="custom">직접 입력</button>
      </div>
    </div>
    ${form.method==="equal"?`<div class="field"><span>총액 (${CUR[form.cur].sym})</span>
      <input id="fTotal" inputmode="decimal" placeholder="0" value="${esc(form.total)}">
      ${ids.length&&total>0?`<small class="hint">${ids.length}명 · 1인당 약 ${fmt(Math.round(total/ids.length),form.cur)}</small>`:""}
    </div>`:""}
    <div style="border-top:1px dashed var(--line);padding-top:12px;margin-top:4px;">
      <div class="hint" style="margin-bottom:8px">참여자 ${ids.length}명 선택</div>
      ${PRESET.map(p=>`<div class="prow">
        <label class="chk" data-p="${esc(p)}">
          <span class="box ${form.checked[p]?"on":""}"></span>
          <span class="pname">${esc(p)}${p===form.payer?`<span class="payer-tag">결제자</span>`:""}</span>
        </label>
        ${form.method==="custom"&&form.checked[p]
          ?`<input class="amt-inp amtI" data-p="${esc(p)}" inputmode="decimal" placeholder="0" value="${esc(form.amounts[p]||"")}">`
          :""}
      </div>`).join("")}
    </div>
    ${form.err?`<div class="err">${form.err}</div>`:""}
    <button class="save" id="submitBtn">정산 요청 보내기 🚀</button>
  </div>`;
}

/* ── 영수증 ── */
function historyHTML(isAdmin) {
  const list = [...state.splits].reverse();
  // 본인이 참여한 것만 (관리자는 전체)
  const visible = isAdmin ? list :
    list.filter(s=>s.payer===state.me||s.shares.some(sh=>sh.name===state.me));
  if(!visible.length) return `<div class="empty">내가 참여한 영수증이 없어요 🧾</div>`;
  return visible.map(s=>{
    const realIdx = state.splits.indexOf(s);
    const total = s.shares.reduce((sum,x)=>sum+x.amount,0);
    const dayLabel = DAYS.find(d=>d.date===s.date)?.label||s.date;
    return `<div class="receipt" data-ri="${realIdx}">
      <div class="r-head">
        <div>
          <div class="r-title">${esc(s.desc)}</div>
          <div class="r-meta">${dayLabel} ${s.timeSlot||""} · <b>${esc(s.payer)}</b> 결제 · ${CUR[s.currency]?.name||s.currency}</div>
        </div>
        <div class="r-amt num">${fmt(total,s.currency)}</div>
      </div>
      <div class="r-body">
        <div class="hint" style="margin-bottom:6px">결제자</div>
        <div class="share-line">
          <span class="pname" style="font-weight:800">${esc(s.payer)}</span>
          <span class="dots"></span>
          <span class="num">${fmt(total,s.currency)}</span>
        </div>
        <div class="hint" style="margin-top:10px;margin-bottom:6px">분담자</div>
        ${s.shares.map(sh=>sh.name===s.payer?"":
          `<div class="share-line">
            <span class="pname">${esc(sh.name)}${sh.name===state.me?` <span class="payer-tag">나</span>`:""}</span>
            <span class="dots"></span>
            <span class="num">${fmt(sh.amount,s.currency)}</span>
          </div>`
        ).join("")}
        ${(s.payer===state.me||isAdmin)
          ?`<button class="del-btn" data-ri="${realIdx}">삭제</button>`:""
        }
      </div>
    </div>`;
  }).join("");
}

/* ─── 로그인 ─── */
function renderLogin() {
  $("#app").innerHTML=`
  <div class="login">
    <div class="l-flag">🇮🇹</div>
    <div class="l-brand">IL CONTO</div>
    <div class="l-sub">밀라노 같이 온 우리끼리 정산 장부<br>이름을 눌러 입장하세요 👇</div>
    <div class="l-card">
      <div class="l-card-h">어느 분이세요?</div>
      <div class="l-grid">
        ${PRESET.map(p=>`<button class="l-btn" data-name="${esc(p)}">${esc(p)}</button>`).join("")}
      </div>
    </div>
  </div>`;
  $("#app").querySelectorAll(".l-btn").forEach(b=>b.addEventListener("click",()=>{
    state.me=b.dataset.name; saveCache(); tab="home"; render(); pull();
  }));
}



/* ─── 이벤트 ─── */
function bindMain() {
  // 탭
  $("#app").querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
    tab=b.dataset.t; if(tab!=="create")form=null; render();
    if(tab!=="create") pull();
  }));
  // 버튼
  const outBtn=$("#outBtn"), syncBtn=$("#syncBtn"), ctaBtn=$("#ctaBtn");
  if(outBtn) outBtn.addEventListener("click",()=>{state.me=null;saveCache();renderLogin();});
  if(syncBtn) syncBtn.addEventListener("click",()=>{toast("동기화 중…");pull();});
  if(ctaBtn) ctaBtn.addEventListener("click",()=>{tab="create";form=null;render();});
  // 통화
  $("#app").querySelectorAll(".cur-tab").forEach(b=>b.addEventListener("click",()=>{cur=b.dataset.c;render();}));
  // 영수증 펼치기
  $("#app").querySelectorAll(".receipt").forEach(r=>{
    r.addEventListener("click",e=>{
      if(e.target.closest(".del-btn"))return;
      r.classList.toggle("open");
    });
  });
  // 영수증 삭제
  $("#app").querySelectorAll(".del-btn").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("이 정산을 삭제할까요?"))return;
    const idx=parseInt(b.dataset.ri);
    const next=state.splits.filter((_,i)=>i!==idx);
    state.splits=next; saveCache(); render();
    try{
      const r=await fetch(API+"/latest",{headers:{"X-Master-Key":MASTER_KEY},cache:"no-store"});
      const j=await r.json(); const d=j.record||{};
      await fetch(API,{method:"PUT",
        headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY},
        body:JSON.stringify({splits:next})});
      toast("삭제됐어요");
    }catch(e){toast("삭제 실패");}
  }));
  // 정산 폼
  if(tab==="create") bindForm();
}

function bindForm() {
  const pay=$("#fPayer"),desc=$("#fDesc"),tot=$("#fTotal");
  if(pay) pay.addEventListener("change",e=>{
    form.payer=e.target.value;
    // 결제자는 항상 체크
    if(!form.checked[form.payer]) form.checked[form.payer]=true;
    render();
  });
  if(desc) desc.addEventListener("input",e=>form.desc=e.target.value);
  if(tot)  tot.addEventListener("input",e=>form.total=e.target.value);
  $("#app").querySelectorAll(".dayBtn").forEach(b=>b.addEventListener("click",()=>{form.day=b.dataset.d;render();}));
  $("#app").querySelectorAll(".timeBtn").forEach(b=>b.addEventListener("click",()=>{form.timeSlot=b.dataset.t;render();}));
  $("#app").querySelectorAll(".curBtn").forEach(b=>b.addEventListener("click",()=>{form.cur=b.dataset.c;render();}));
  $("#app").querySelectorAll(".mBtn").forEach(b=>b.addEventListener("click",()=>{form.method=b.dataset.m;render();}));
  $("#app").querySelectorAll(".chk").forEach(l=>l.addEventListener("click",()=>{
    const p=l.dataset.p;
    if(p===form.payer)return; // 결제자는 해제 불가
    form.checked[p]=!form.checked[p];render();
  }));
  $("#app").querySelectorAll(".amtI").forEach(i=>i.addEventListener("input",()=>{form.amounts[i.dataset.p]=i.value;}));
  const sub=$("#submitBtn");
  if(sub) sub.addEventListener("click",handleCreate);
}

async function handleCreate() {
  if(!form.desc.trim()){form.err="내용을 입력해주세요.";return render();}
  const ids=PRESET.filter(p=>form.checked[p]);
  if(!ids.length){form.err="참여자를 선택해주세요.";return render();}
  // 결제자가 체크 안 됐으면 추가
  if(!ids.includes(form.payer)) ids.unshift(form.payer);

  let shares=[];
  if(form.method==="equal"){
    const tot=toMinor(form.total,form.cur);
    if(tot<=0){form.err="총액을 입력해주세요.";return render();}
    const parts=splitEqual(tot,ids.length);
    shares=ids.map((name,i)=>({name,amount:parts[i]}));
  } else {
    for(const name of ids){
      const a=toMinor(form.amounts[name]||"0",form.cur);
      if(a<=0){form.err=`${name}님 금액을 입력해주세요.`;return render();}
      shares.push({name,amount:a});
    }
  }

  const newSplit={id:uid(),payer:form.payer,date:form.day,timeSlot:form.timeSlot,
                  currency:form.cur,desc:form.desc.trim(),shares};
  const next=[...state.splits,newSplit];
  state.splits=next; saveCache(); form=null; tab="history"; render();

  try {
    const r=await fetch(API+"/latest",{headers:{"X-Master-Key":MASTER_KEY},cache:"no-store"});
    const j=await r.json(); const d=j.record||{};
    await push([...(Array.isArray(d.splits)?d.splits:state.splits.slice(0,-1)), newSplit]);
    // 위에서 이미 local에 추가했으니 서버 최신 반영
    const r2=await fetch(API+"/latest",{headers:{"X-Master-Key":MASTER_KEY},cache:"no-store"});
    const j2=await r2.json(); const d2=j2.record||{};
    state.splits=Array.isArray(d2.splits)?d2.splits:next; saveCache();
    toast("✅ 정산이 등록됐어요! 다른 분들은 ↻ 새로고침을 눌러주세요",4000);
    render();
  } catch(e){toast("저장 실패 — 재시도 중…");}
}

/* ─── BOOT ─── */
loadCache(); render(); pull();
</script>
</body>
</html>
