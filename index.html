<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>IL CONTO · 밀라노 정산</title>
<style>
:root{--cream:#FFF8F2;--card:#FFFFFF;--ink:#2C1A0E;--terra:#E8694A;--shadow:0 4px 16px rgba(44,26,14,.06);}
body{font-family:sans-serif;background:var(--cream);color:var(--ink);margin:0;padding:0;}
#app{max-width:560px;margin:0 auto;}
.hdr{position:fixed;top:0;left:0;right:0;background:var(--card);padding:10px;box-shadow:var(--shadow);z-index:20;}
.tabs{display:flex;gap:5px;margin-top:10px;}
.tab{flex:1;padding:10px;border:none;background:#eee;border-radius:8px;font-weight:bold;}
.tab.on{background:var(--terra);color:#fff;}
.content{padding:140px 15px 20px;}
.card{background:var(--card);padding:15px;border-radius:15px;margin-bottom:10px;box-shadow:var(--shadow);}
.btn{padding:10px;border-radius:8px;border:none;background:var(--terra);color:#fff;width:100%;font-weight:bold;margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BIN_ID="6a38dd76f5f4af5e291b671d", MASTER_KEY="$2a$10$lnj2XARlHWVJZ4Vkc3YtNuH.64V8zJei.7NfckLaIR8Py6ZCdkZCa";
const PRESET = ["김가영","김민준","김주희","김진현","심성태","양보윤","이승재","이원태","정직한","정현주","조현지","최필성"];
let state = { splits: [] }, activeTab = "home", currentViewer = "전체보기", currentCurrency = "EUR";

async function loadData() {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers:{"X-Master-Key":MASTER_KEY} });
  if(r.ok) {
    const j = await r.json();
    state.splits = j.record?.splits || [];
    // 데이터가 있는 첫 통화로 자동 전환
    if(state.splits.length > 0 && !state.splits.some(s=>s.currency===currentCurrency)) {
      currentCurrency = state.splits[0].currency;
    }
  }
  render();
}

function render() {
  document.getElementById("app").innerHTML = `
  <div class="hdr">
    <div style="display:flex;justify-content:space-between;"><b>IL CONTO</b> <button onclick="loadData()">새로고침</button></div>
    <div class="tabs">
      <button class="tab ${activeTab==='home'?'on':''}" onclick="activeTab='home';render()">🏠 대시보드</button>
      <button class="tab ${activeTab==='create'?'on':''}" onclick="activeTab='create';render()">💳 정산 입력</button>
      <button class="tab ${activeTab==='history'?'on':''}" onclick="activeTab='history';render()">🧾 영수증</button>
    </div>
  </div>
  <div class="content">${activeTab==='home'?homeHTML():activeTab==='create'?createHTML():historyHTML()}</div>`;
}

function homeHTML() {
  let html = `<div style="display:flex;gap:5px;margin-bottom:10px;">${["EUR","KRW","TRY"].map(c=>`<button class="tab ${currentCurrency===c?'on':''}" onclick="currentCurrency='${c}';render()">${c}</button>`).join("")}</div>
  <select style="width:100%;padding:10px;" onchange="currentViewer=this.value;render()">
    <option value="전체보기">📊 전체 현황</option>${PRESET.map(p=>`<option value="${p}" ${currentViewer===p?'selected':''}>👤 ${p}님 보기</option>`).join("")}
  </select>`;
  
  const relevant = state.splits.filter(s => s.currency === currentCurrency);
  if(relevant.length === 0) return html + `<p>내역이 없습니다.</p>`;

  relevant.forEach(s => {
    html += `<div class="card"><b>${s.desc}</b> (결제: ${s.payer})<br>${s.shares.map(sh=>`${sh.name}:${sh.amount}`).join(", ")}</div>`;
  });
  return html;
}

function createHTML() {
  return `<div class="card">
    결제자: <select id="payer">${PRESET.map(p=>`<option>${p}</option>`).join("")}</select><br>
    내용: <input id="desc"><br>금액: <input id="amt" type="number"><br>
    <button class="btn" onclick="save()">입력 완료</button>
  </div>`;
}

function historyHTML() {
  return state.splits.map((s,i) => `<div class="card">${s.desc} - ${s.payer} <button onclick="del(${i})">삭제</button></div>`).join("");
}

async function save() {
  const d = { payer:document.getElementById("payer").value, currency:currentCurrency, desc:document.getElementById("desc").value, 
              shares:PRESET.filter(p=>p!==document.getElementById("payer").value).map(p=>({name:p, amount:Math.round(document.getElementById("amt").value/(PRESET.length-1))})) };
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { method:"PUT", headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY}, body:JSON.stringify({record:{splits:[...state.splits, d]}}) });
  loadData();
}

async function del(i) {
  state.splits.splice(i,1);
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, { method:"PUT", headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY}, body:JSON.stringify({record:{splits:state.splits}}) });
  loadData();
}

loadData();
</script>
</body>
</html>
