<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>IL CONTO · 밀라노 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#FFF8F2;--card:#FFFFFF;--ink:#2C1A0E;--ink-soft:#8A6E62;
  --line:#EEE5DD;--terra:#E8694A;--terra-d:#C9512F;--sun:#F2B134;
  --sage:#3A9163;--credit:#2E8A5C;--debit:#D94F30;--pending:#C07828;
  --shadow:0 2px 16px rgba(44,26,14,.09);--shadow-sm:0 1px 6px rgba(44,26,14,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;}
#app{max-width:560px;margin:0 auto;min-height:100vh;}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
.credit{color:var(--credit);}.debit{color:var(--debit);}.pending{color:var(--pending);}.zero{color:var(--ink-soft);}
button{font-family:'Nunito',sans-serif;cursor:pointer;}
input,select{font-family:'Nunito',sans-serif;}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);
  box-shadow:0 1px 0 var(--line),0 2px 12px rgba(44,26,14,.06);}
.hdr-in{max-width:560px;margin:0 auto;padding:12px 18px 0;}
.hdr-top{display:flex;justify-content:space-between;align-items:center;}
.brand-wrap{display:flex;align-items:baseline;gap:8px;}
.brand{font-size:1.6rem;font-weight:900;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--terra) 0%,var(--sun) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.brand-sub{font-size:.6rem;font-weight:800;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase;}
.whoami{font-size:.72rem;color:var(--ink-soft);text-align:right;}
.whoami b{color:var(--terra);font-weight:900;}
.hdr-btns{display:flex;gap:5px;justify-content:flex-end;margin-top:4px;}
.icon-btn{background:none;border:1.5px solid var(--line);border-radius:999px;
  padding:5px 11px;font-size:.7rem;color:var(--ink-soft);font-weight:700;}
.tabs{display:flex;gap:2px;margin-top:12px;}
.tab{flex:1;background:none;border:none;padding:10px 2px;font-size:.78rem;font-weight:800;
  color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;}
.tab.on{color:var(--terra);border-bottom-color:var(--terra);}
.content{padding:136px 16px 48px;}

/* ── CARDS & COMPONENTS ── */
.card{background:var(--card);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.sec-h{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;}
.cta{width:100%;background:linear-gradient(135deg,var(--terra) 0%,#F08050 100%);
  color:#fff;border:none;border-radius:18px;padding:22px 20px;text-align:left;
  margin-bottom:16px;box-shadow:0 6px 20px rgba(232,105,74,.35);}
.cta:active{transform:scale(.98);}
.cta .big{font-size:1.15rem;font-weight:900;letter-spacing:-.01em;}
.cta .sub{font-size:.78rem;opacity:.9;margin-top:4px;font-weight:600;}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:.82rem;font-weight:800;color:var(--ink);flex:1;text-align:center;}
.btn.primary{background:var(--terra);color:#fff;border-color:var(--terra);}
.btn.ghost{color:var(--ink-soft);}
.btn.danger{background:#FFE9E4;color:var(--debit);border-color:transparent;}

/* ── WALLET ── */
.wallet{background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.wallet-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1rem;margin-bottom:12px;}
.wallet-h .sym{width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--terra),var(--sun));display:grid;place-items:center;font-size:.9rem;}
.w-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.w-cell{background:var(--cream);border-radius:11px;padding:11px;}
.w-cell .lbl{font-size:.66rem;color:var(--ink-soft);font-weight:700;}
.w-cell .val{font-size:1.05rem;font-weight:900;margin-top:2px;}
.w-net{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:800;}

/* ── INBOX ── */
.inbox-item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:9px;box-shadow:var(--shadow-sm);}
.ii-top{display:flex;justify-content:space-between;gap:8px;}
.ii-desc{font-weight:800;font-size:.95rem;}
.ii-meta{font-size:.7rem;color:var(--ink-soft);margin-top:2px;font-weight:600;}
.ii-amt{font-weight:900;font-size:1.05rem;white-space:nowrap;}
.ii-actions{display:flex;gap:7px;margin-top:11px;}
.badge{display:inline-block;font-size:.62rem;font-weight:800;padding:2px 8px;border-radius:999px;}
.badge.pend{background:#FEF0C7;color:var(--pending);}
.badge.acc{background:#D1FAE5;color:var(--credit);}
.badge.edit{background:#FFE4DD;color:var(--debit);}

/* ── FORM ── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field>span{font-size:.72rem;color:var(--ink-soft);font-weight:800;}
.field input,.field select{font-size:.95rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;width:100%;color:var(--ink);font-weight:700;}
.field input:focus,.field select:focus{outline:2px solid var(--terra);border-color:transparent;}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.seg button{flex:1;min-width:0;padding:10px 6px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:.8rem;font-weight:800;color:var(--ink-soft);}
.seg button.on{background:var(--terra);color:#fff;border-color:var(--terra);}
.curseg button.on{background:var(--ink);border-color:var(--ink);}
.day-seg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px;}
.day-seg button{padding:8px 2px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:.7rem;font-weight:800;color:var(--ink-soft);text-align:center;line-height:1.3;}
.day-seg button .dow{font-size:.58rem;opacity:.65;display:block;}
.day-seg button.on{background:var(--terra);color:#fff;border-color:var(--terra);}
.time-seg{display:flex;gap:5px;margin-bottom:14px;}
.time-seg button{flex:1;padding:9px 4px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:.76rem;font-weight:800;color:var(--ink-soft);}
.time-seg button.on{background:var(--sun);color:var(--ink);border-color:var(--sun);}
.people{border-top:1px dashed var(--line);padding-top:12px;}
.prow{display:flex;align-items:center;gap:10px;padding:5px 0;}
.chk{display:flex;align-items:center;gap:10px;flex:1;user-select:none;}
.box{width:20px;height:20px;border:2px solid var(--line);border-radius:6px;position:relative;flex:none;}
.box.on{background:var(--terra);border-color:var(--terra);}
.box.on:after{content:"✓";color:#fff;font-size:13px;font-weight:900;position:absolute;left:3px;top:-1px;}
.pname{font-size:.92rem;font-weight:700;}
.me-tag{font-size:.58rem;background:var(--sun);color:var(--ink);padding:1px 7px;border-radius:999px;font-weight:900;}
.amt{width:108px;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;text-align:right;font-family:ui-monospace,monospace;font-weight:700;}
.dots{flex:1;border-bottom:1.5px dotted var(--line);margin:0 8px;transform:translateY(-3px);}
.total-line{display:flex;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-weight:900;}
.hint{font-size:.72rem;color:var(--ink-soft);font-weight:600;}
.err-box{background:#FFE9E4;color:var(--debit);border-radius:11px;padding:10px 14px;font-size:.82rem;margin-bottom:10px;font-weight:700;}
.save{width:100%;background:linear-gradient(135deg,var(--terra),#F08050);color:#fff;border:none;border-radius:13px;padding:16px;font-size:1rem;font-weight:900;box-shadow:0 4px 14px rgba(232,105,74,.3);}
.save:disabled{opacity:.5;}

/* ── HISTORY (영수증) ── */
.receipt{background:var(--card);border-radius:16px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .1s;}
.receipt:active{transform:scale(.99);}
.r-top{display:flex;justify-content:space-between;gap:8px;pointer-events:none;}
.r-desc{font-weight:800;font-size:1rem;}
.r-meta{font-size:.7rem;color:var(--ink-soft);margin-top:2px;font-weight:600;}
.r-total{font-weight:900;font-size:1.1rem;white-space:nowrap;}
.share-line{display:flex;align-items:center;font-size:.86rem;padding:4px 0;}
.receipt-details{display:none;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);cursor:default;}
.receipt.expanded .receipt-details{display:block;}
.settle-item{display:flex;align-items:center;font-size:.88rem;padding:8px 0;border-bottom:1px solid var(--line);}
.settle-item:last-child{border-bottom:none;}

/* ── MEMBERS ── */
.mrow{display:flex;align-items:center;gap:9px;margin-bottom:8px;}
.mnum{font-family:ui-monospace,monospace;font-size:.74rem;color:var(--ink-soft);width:22px;font-weight:700;}
.mrow input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:700;}
.mrow input:disabled{background:#f9f9f9;color:#888;}
.mx{background:none;border:none;color:var(--ink-soft);opacity:.45;font-size:.9rem;}
.preset-lock{font-size:.72rem;color:var(--ink-soft);padding:0 6px;}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 20px 64px;
  background:linear-gradient(160deg,#FFF2E6 0%,#FFF8F2 50%,#F2F6FF 100%);}
.l-flag{font-size:3rem;line-height:1;margin-bottom:6px;}
.l-brand{font-size:2.8rem;font-weight:900;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(135deg,var(--terra) 10%,var(--sun) 90%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;}
.l-tag{font-size:.9rem;font-weight:700;color:var(--ink-soft);margin-bottom:28px;text-align:center;line-height:1.6;}
.l-card{background:var(--card);border-radius:22px;padding:22px 20px;width:100%;max-width:380px;box-shadow:var(--shadow);}
.l-card-h{font-weight:900;font-size:1.05rem;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.pick-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:0;}
.pick-btn{padding:13px 6px;border:1.5px solid var(--line);background:#fff;border-radius:12px;
  font-size:.88rem;font-weight:800;color:var(--ink);text-align:center;line-height:1.3;position:relative;}
.pick-btn:active{transform:scale(.97);background:var(--cream);}
.pick-btn.claimed::after{content:"✓";position:absolute;top:5px;right:7px;font-size:.6rem;
  color:var(--credit);font-weight:900;}
.pick-btn.claimed{border-color:#D1FAE5;}
.l-selected-name{font-size:1.6rem;font-weight:900;color:var(--terra);text-align:center;margin:4px 0 6px;}
.l-pin-sub{font-size:.85rem;color:var(--ink-soft);text-align:center;margin-bottom:18px;font-weight:600;}
.l-pin-input{width:100%;font-size:1.6rem;padding:14px;border:2px solid var(--line);border-radius:13px;
  background:#fff;letter-spacing:.4em;text-align:center;font-family:ui-monospace,monospace;font-weight:900;margin-bottom:12px;}
.l-pin-input:focus{outline:2px solid var(--terra);border-color:transparent;}
.l-submit{width:100%;background:linear-gradient(135deg,var(--terra),#F08050);color:#fff;border:none;
  border-radius:13px;padding:15px;font-size:1rem;font-weight:900;box-shadow:0 4px 14px rgba(232,105,74,.3);}
.l-back{width:100%;background:none;border:1.5px solid var(--line);border-radius:11px;padding:11px;
  font-size:.88rem;font-weight:700;color:var(--ink-soft);margin-top:8px;}
.l-err{background:#FFE9E4;color:var(--debit);border-radius:10px;padding:9px 14px;
  font-size:.82rem;margin-bottom:12px;font-weight:700;text-align:center;}

/* ── MISC ── */
.empty{text-align:center;color:var(--ink-soft);padding:44px 18px;line-height:1.8;font-weight:600;}
.foot{text-align:center;font-size:.66rem;color:var(--ink-soft);padding:18px;font-weight:600;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:.82rem;font-weight:700;z-index:50;opacity:0;transition:opacity .2s;white-space:nowrap;}
.toast.show{opacity:1;}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
/* ─── CONFIG ─── */
const BIN_ID     = "6a38adf7f5f4af5e291acf18";
const MASTER_KEY = "$2a$10$knEeVypXEreIpvS8jjaIcuYwEtCdVzgfneXidZApzdleNV3BNltwi";
const API        = "https://api.jsonbin.io/v3/b/" + BIN_ID;

/* ─── 12명 프리셋 (이름순, 안정 ID) ─── */
const PRESET = [
  {id:"pm01",name:"김가영"},{id:"pm02",name:"김민준"},{id:"pm03",name:"김주희"},
  {id:"pm04",name:"김진현"},{id:"pm05",name:"심성태"},{id:"pm06",name:"양보윤"},
  {id:"pm07",name:"이승재"},{id:"pm08",name:"이원태"},{id:"pm09",name:"정직한"},
  {id:"pm10",name:"정현주"},{id:"pm11",name:"조현지"},{id:"pm12",name:"최필성"},
];

const DAYS=[
  {date:"2026-06-21",label:"21일",dow:"일"},{date:"2026-06-22",label:"22일",dow:"월"},
  {date:"2026-06-23",label:"23일",dow:"화"},{date:"2026-06-24",label:"24일",dow:"수"},
  {date:"2026-06-25",label:"25일",dow:"목"},{date:"2026-06-26",label:"26일",dow:"금"},
  {date:"2026-06-27",label:"27일",dow:"토"},
];
const TIMES=["오전","점심","오후","저녁","밤"];
const CUR={
  EUR:{sym:"€",dp:2,factor:100,name:"유로"},
  KRW:{sym:"₩",dp:0,factor:1,name:"원화"},
  TRY:{sym:"₺",dp:2,factor:100,name:"리라"},
};
const CUR_ORDER=["EUR","KRW","TRY"];
const CTA_POOL=[
  {big:"이번엔 제 카드로 하시죠 →",sub:"어서 쓰세요, 여기서 나눠요"},
  {big:"잠깐, 제가 긁겠습니다 →",sub:"나중에 여기서 정확하게 정산해요"},
  {big:"오늘은 제가 한 번 쏠게요 →",sub:"일단 내고 나중에 나눠요"},
  {big:"이번엔 제가 결제 해보겠습니다 →",sub:"영수증은 여기 앱에 남겨둘게요"},
  {big:"오늘 식사, 제가 책임지겠습니다 →",sub:"누가 얼마씩인지 여기서 정해요"},
];

/* ─── STATE ─── */
let state={record:{members:[],splits:[]},me:null,tab:"home",busy:false};
let form=null, mdraft=null;
// 로그인 상태
let lStep="pick"; // "pick" | "pin"
let lPick=null;   // {id, name, hasPin}
let lPin="", lErr="";

/* ─── UTILS ─── */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMinor=(v,cur)=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:Math.round(n*CUR[cur].factor);};
const fmt=(minor,cur)=>{const c=CUR[cur];return c.sym+(minor/c.factor).toLocaleString("ko-KR",{minimumFractionDigits:c.dp,maximumFractionDigits:c.dp});};
const nameOf=id=>{const m=state.record.members.find(m=>m.id===id);return m?m.name:"(?)"};
function splitEqual(total,n){if(n<=0)return[];const base=Math.floor(total/n);let rem=total-base*n;
  return Array.from({length:n},()=>{const e=rem>0?1:0;if(rem>0)rem--;return base+e;});}
const ctaObj=()=>CTA_POOL[Math.floor(Date.now()/60000)%CTA_POOL.length];
function toast(msg,dur=1800){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),dur);}

/* ─── CACHE ─── */
const CACHE="ml_ilconto_v2";
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE)||"{}");
  if(c.record)state.record=c.record;if(c.me)state.me=c.me;}catch(e){}}
function saveCache(){try{localStorage.setItem(CACHE,JSON.stringify({record:state.record,me:state.me}));}catch(e){}}

/* ─── API ─── */
async function fetchRecord(){
  const r=await fetch(API+"/latest",{headers:{"X-Master-Key":MASTER_KEY}});
  if(!r.ok)throw new Error("fetch "+r.status);
  const j=await r.json();
  const rec=j.record||{};
  if(!Array.isArray(rec.members))rec.members=[];
  if(!Array.isArray(rec.splits))rec.splits=[];
  return rec;
}
async function putRecord(rec){
  const doput=async()=>{
    const r=await fetch(API,{method:"PUT",
      headers:{"Content-Type":"application/json","X-Master-Key":MASTER_KEY},
      body:JSON.stringify(rec)});
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r;
  };
  try{return await doput();}
  catch(e){
    await new Promise(res=>setTimeout(res,1500));
    return await doput();
  }
}

function mergePresets(rec){
  let changed=false;
  PRESET.forEach(p=>{
    if(!rec.members.find(m=>m.id===p.id)){
      rec.members.push({id:p.id,name:p.name,pin:null});
      changed=true;
    }
  });
  return changed;
}

async function pull(){
  try{
    const rec=await fetchRecord();
    const changed=mergePresets(rec);
    if(changed)await putRecord(rec);
    state.record=rec;saveCache();render();
  }catch(e){
    console.warn("pull failed",e);
    mergePresets(state.record);
    render();
  }
}

async function mutate(fn){
  if(state.busy){toast("처리 중이에요, 잠시만요…");return false;}
  state.busy=true;
  try{
    let rec;
    try{rec=await fetchRecord();}
    catch(e){rec=JSON.parse(JSON.stringify(state.record));}
    mergePresets(rec);
    fn(rec);
    state.record=rec;saveCache();
    await putRecord(rec);
    return true;
  }catch(e){
    console.warn("mutate error",e);
    return false;
  }finally{
    state.busy=false;render();
  }
}

/* ─── 계산 ─── */
function settleByCurrency(cur){
  const net={};state.record.members.forEach(m=>net[m.id]=0);
  state.record.splits.filter(s=>s.currency===cur).forEach(s=>{
    s.shares.forEach(sh=>{
      if(sh.memberId===s.payerId)return;
      if(sh.status==="confirmed"){
        net[s.payerId]=(net[s.payerId]||0)+sh.amount;
        net[sh.memberId]=(net[sh.memberId]||0)-sh.amount;
      }
    });
  });
  const deb=[],cre=[];
  Object.entries(net).forEach(([id,v])=>{if(v<0)deb.push({id,amt:-v});else if(v>0)cre.push({id,amt:v});});
  deb.sort((a,b)=>b.amt-a.amt);cre.sort((a,b)=>b.amt-a.amt);
  const txns=[];let i=0,j=0;
  while(i<deb.length&&j<cre.length){
    const pay=Math.min(deb[i].amt,cre[j].amt);
    if(pay>0)txns.push({from:deb[i].id,to:cre[j].id,amt:pay});
    deb[i].amt-=pay;cre[j].amt-=pay;
    if(deb[i].amt<=0)i++;if(cre[j].amt<=0)j++;
  }
  return{net,txns};
}
function myWallet(cur){
  const me=state.me;let owe=0,recv=0,pendOwe=0,pendRecv=0;
  state.record.splits.filter(s=>s.currency===cur).forEach(s=>{
    s.shares.forEach(sh=>{
      if(sh.memberId===s.payerId)return;
      const acc=sh.status==="accepted",pend=sh.status==="pending"||sh.status==="edit_requested";
      if(s.payerId===me&&sh.memberId!==me){if(acc)recv+=sh.amount;if(pend)pendRecv+=sh.amount;}
      if(sh.memberId===me&&s.payerId!==me){if(acc)owe+=sh.amount;if(pend)pendOwe+=sh.amount;}
    });
  });
  return{owe,recv,pendOwe,pendRecv,net:recv-owe};
}
function myInbox(){
  const me=state.me;const items=[];
  state.record.splits.forEach(s=>{
    if(s.payerId!==me){
      const sh=s.shares.find(x=>x.memberId===me);
      if(sh&&sh.status==="confirmed")items.push({type:"pending",split:s,share:sh});
      if(sh&&sh.status==="edit_requested")items.push({type:"mine_pending",split:s,share:sh});
    }
    if(s.payerId===me){
      s.shares.forEach(sh=>{
        if(sh.memberId!==me&&sh.status==="edit_requested")
          items.push({type:"approve_edit",split:s,share:sh});
      });
    }
  });
  const w={approve_edit:0,accept:1,mine_pending:2};
  items.sort((a,b)=>w[a.type]-w[b.type]);
  return items;
}

  const members=state.record.members;
  const presetIds=PRESET.map(p=>p.id);
  const sorted=[
    ...PRESET.map(p=>members.find(m=>m.id===p.id)||{id:p.id,name:p.name,pin:null}),

      <div class="l-flag">🇮🇹</div>

        ${lErr?`<div class="l-err">${lErr}</div>`:""}
        <div class="pick-grid">
          ${sorted.map(m=>{
            const claimed=!!(m.pin);
            return`<button class="pick-btn ${claimed?"claimed":""}" data-pickid="${m.id}" data-pickname="${esc(m.name)}" data-haspin="${claimed}">
              ${esc(m.name)}</button>`;
          }).join("")}
        </div>
      </div>
    </div>`;
    $("#app").querySelectorAll(".pick-btn").forEach(b=>{
      b.addEventListener("click",()=>{
        lPick={id:b.dataset.pickid,name:b.dataset.pickname,hasPin:b.dataset.haspin==="true"};
        lStep="pin";lPin="";lErr="";renderLogin();
      });
    });
  } else {
    $("#app").innerHTML=`
    <div class="login-wrap">
      <div class="l-flag">🇮🇹</div>
      <div class="l-brand">IL CONTO</div>
      <div class="l-card">
        ${lErr?`<div class="l-err">${lErr}</div>`:""}
        <div class="l-selected-name">${esc(lPick.name)}</div>
        <div class="l-pin-sub">${lPick.hasPin?"PIN을 입력해주세요 🔐":"처음이시군요! PIN 4자리를 설정해주세요"}</div>
        <input id="pinEl" type="password" inputmode="numeric" maxlength="4" placeholder="• • • •" class="l-pin-input" value="${lPin}" autocomplete="off"/>
        <button class="l-submit" id="pinSubmit">밀라노 장부 입장 🚀</button>
        <button class="l-back" id="pinBack">← 다시 선택</button>
      </div>
    </div>`;
    const pinEl=$("#pinEl");
    pinEl.addEventListener("input",()=>{lPin=pinEl.value.replace(/\D/g,"").slice(0,4);pinEl.value=lPin;});
    pinEl.addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
    $("#pinSubmit").addEventListener("click",doLogin);
    $("#pinBack").addEventListener("click",()=>{lStep="pick";lErr="";lPin="";renderLogin();});
    pinEl.focus();
  }
}

async function doLogin(){
  const pin=lPin;
  if(pin.length!==4||!/^\d{4}$/.test(pin)){lErr="PIN은 숫자 4자리여야 해요.";return renderLogin();}

  let rec;
  try{rec=await fetchRecord();}
  catch(e){rec=JSON.parse(JSON.stringify(state.record));}
  mergePresets(rec);

  const member=rec.members.find(m=>m.id===lPick.id);
  if(!member){lErr="멤버를 찾을 수 없어요. 다시 시도해주세요.";return renderLogin();}

  if(member.pin){
    if(member.pin!==pin){lErr="PIN이 맞지 않아요 🔐";return renderLogin();}
    state.me=member.id;
    state.record=rec;saveCache();
    lStep="pick";lPin="";lErr="";
    state.tab="home";render();
  } else {
    member.pin=pin;
    state.record=rec;
    try{
      await putRecord(rec);
      saveCache();
      state.me=member.id;
      lStep="pick";lPin="";lErr="";
      state.tab="home";render();
      toast("PIN이 설정됐어요 ✓");
    }catch(e){
      lErr="저장에 실패했어요. 네트워크를 확인해주세요.";renderLogin();
    }
  }
}

/* ─── 바인딩 ─── */
function bind(){
  const app=$("#app");
  app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
    state.tab=b.dataset.tab;if(b.dataset.tab!=="create"){form=null;pull();}render();}));
  app.querySelectorAll("[data-f]").forEach(el=>el.addEventListener("input",()=>{form[el.dataset.f]=el.value;}));
  app.querySelectorAll("[data-cur]").forEach(b=>b.addEventListener("click",()=>{form.currency=b.dataset.cur;render();}));
  app.querySelectorAll("[data-m]").forEach(b=>b.addEventListener("click",()=>{form.method=b.dataset.m;render();}));
  app.querySelectorAll("[data-day]").forEach(b=>b.addEventListener("click",()=>{form.day=b.dataset.day;render();}));
  app.querySelectorAll("[data-time]").forEach(b=>b.addEventListener("click",()=>{form.timeSlot=b.dataset.time;render();}));
  app.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{form.checked[el.dataset.toggle]=!form.checked[el.dataset.toggle];render();}));
  app.querySelectorAll("[data-amt]").forEach(el=>el.addEventListener("input",()=>{form.amounts[el.dataset.amt]=el.value;}));
  app.querySelectorAll("[data-mname]").forEach(el=>el.addEventListener("input",()=>{const m=mdraft.find(x=>x.id===el.dataset.mname);if(m){m.name=el.value;}}));
  
  // 영수증 펼치기 처리 (버튼 클릭시 무시)
  app.querySelectorAll(".receipt").forEach(r=>{
    r.addEventListener("click",(e)=>{
      if(e.target.closest("button")) return; 
      const id=r.id;if(id)r.classList.toggle("expanded");
    });
  });
  
  app.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>handleAct(b.dataset.act,b.dataset)));
}

async function handleAct(act,d){
  const sid=d.sid;
  switch(act){
    case "switch":state.me=null;lStep="pick";lErr="";lPin="";saveCache();render();break;
    case "pull":toast("동기화 중…");await pull();toast("최신 상태예요 ✓");break;
    case "createsplit":return createSplit();
    
    case "reqedit":{
      const s=state.record.splits.find(x=>x.id===sid);
      const sh=s?.shares.find(x=>x.memberId===state.me);const cur=s.currency;
      const v=prompt(`수정할 내 금액 (${CUR[cur].sym})`,(sh.amount/CUR[cur].factor).toString());
      if(v===null)break;const minor=toMinor(v,cur);
      await mutate(rec=>{const ss=rec.splits.find(x=>x.id===sid);
        const ssh=ss.shares.find(x=>x.memberId===state.me);ssh.status="edit_requested";ssh.proposed=minor;});
      toast("수정 요청을 보냈어요");break;}
    case "canceledit":
      await mutate(rec=>{const s=rec.splits.find(x=>x.id===sid);
        const sh=s.shares.find(x=>x.memberId===state.me);sh.status="pending";sh.proposed=null;});
      toast("요청을 취소했어요");break;
    case "approveedit":
      await mutate(rec=>{const s=rec.splits.find(x=>x.id===sid);
        const sh=s.shares.find(x=>x.memberId===d.mid);sh.amount=sh.proposed;sh.proposed=null;sh.status="accepted";});
      toast("반영 완료! 다른 분들은 ↻ 새로고침을 눌러주세요",3000);break;
    case "rejectedit":
      await mutate(rec=>{const s=rec.splits.find(x=>x.id===sid);
        const sh=s.shares.find(x=>x.memberId===d.mid);sh.proposed=null;sh.status="pending";});
      toast("거절했어요. 대기중으로 돌아가요");break;
    case "delsplit":
      if(!confirm("이 정산을 정말 삭제할까요?"))break;
      await mutate(rec=>{rec.splits=rec.splits.filter(x=>x.id!==sid);});toast("삭제했어요");break;
    case "madd":mdraft.push({id:uid(),name:"일행 "+(mdraft.length+1),pin:null});render();break;
    case "mremove":
      if(PRESET.find(p=>p.id===d.mid)){toast("프리셋 멤버는 삭제할 수 없어요");break;}
      mdraft=mdraft.filter(x=>x.id!==d.mid);render();break;
    case "msave":
      await mutate(rec=>{
        mdraft.forEach(dm=>{
          const ex=rec.members.find(x=>x.id===dm.id);
          if(ex && !PRESET.find(p=>p.id===dm.id)){ex.name=dm.name||"이름없음";} 
          else if(!ex) rec.members.push({id:dm.id,name:dm.name||"이름없음",pin:null});
        });
        const presetIds=PRESET.map(p=>p.id);
        rec.members=rec.members.filter(m=>presetIds.includes(m.id)||mdraft.some(dm=>dm.id===m.id));
      });mdraft=null;toast("저장했어요 ✓");break;
  }
}

async function createSplit(){
  ensureForm();const cur=form.currency;
  const ids=state.record.members.filter(m=>form.checked[m.id]).map(m=>m.id);
  if(!form.desc.trim()){form.err="내용을 적어주세요.";return render();}
  if(!ids.length){form.err="참여자를 한 명 이상 선택해주세요.";return render();}
  let shares=[];
  if(form.method==="equal"){
    const total=toMinor(form.total,cur);
    if(total<=0){form.err="총액을 입력해주세요.";return render();}
    const parts=splitEqual(total,ids.length);
    shares=ids.map((id,i)=>({memberId:id,amount:parts[i],status:"confirmed",proposed:null}));
  } else {
    shares=ids.map(id=>({memberId:id,amount:toMinor(form.amounts[id]||0,cur),
      status:"confirmed",proposed:null}));
    if(shares.reduce((t,x)=>t+x.amount,0)<=0){form.err="각 참여자 금액을 입력해주세요.";return render();}
  }
  const split={id:uid(),payerId:state.me,currency:cur,desc:form.desc.trim(),
    date:form.day,timeSlot:form.timeSlot,method:form.method,shares,createdAt:Date.now()};
  const ok=await mutate(rec=>rec.splits.push(split));
  if(ok){
    form=null;state.tab="home";
    toast("✅ 정산이 등록되었어요!\n\n다른 멤버들은 우상단 ↻ 새로고침 버튼을 눌러서 확인할 수 있어요",4000);
    render();
  }
}
